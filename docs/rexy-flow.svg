<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
  </defs>

  <rect width="1040" height="600" fill="#ffffff" rx="16"/>

  <text x="24" y="36" font-size="18" font-weight="700" fill="#202124">How rexy works</text>

  <!-- Browser -->
  <rect x="40" y="180" width="190" height="150" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="135" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#174ea6">Browser</text>
  <text x="135" y="232" text-anchor="middle" font-size="11" fill="#202124">Chrome / Chromium /</text>
  <text x="135" y="248" text-anchor="middle" font-size="11" fill="#202124">custom executable</text>
  <text x="135" y="274" text-anchor="middle" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#3c4043">--proxy-pac-url=…</text>
  <text x="135" y="290" text-anchor="middle" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#3c4043">--disable-quic</text>
  <text x="135" y="314" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">launched by rexy</text>

  <!-- PAC script -->
  <rect x="430" y="40" width="240" height="110" rx="12" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="550" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#b06000">PAC script</text>
  <text x="550" y="90" text-anchor="middle" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#3c4043">127.0.0.1:&lt;port&gt;/proxy.pac</text>
  <text x="550" y="110" text-anchor="middle" font-size="10" fill="#202124">intercepted host → PROXY 127.0.0.1:&lt;port&gt;</text>
  <text x="550" y="126" text-anchor="middle" font-size="10" fill="#202124">everything else → DIRECT</text>

  <!-- MITM proxy -->
  <rect x="430" y="200" width="240" height="120" rx="12" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="550" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#137333">Rexy MITM proxy</text>
  <text x="550" y="252" text-anchor="middle" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#3c4043">hudsucker · 127.0.0.1:&lt;port&gt;</text>
  <text x="550" y="276" text-anchor="middle" font-size="10.5" fill="#202124">rewrites matching requests</text>
  <text x="550" y="294" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">only SNI = intercepted host</text>

  <!-- Local dev server -->
  <rect x="810" y="200" width="190" height="120" rx="12" fill="#f1f8e9" stroke="#7cb342" stroke-width="2"/>
  <text x="905" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#33691e">Local dev server</text>
  <text x="905" y="254" text-anchor="middle" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#3c4043">http://127.0.0.1:5173</text>
  <text x="905" y="276" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">--target</text>

  <!-- Rexy Local CA -->
  <rect x="430" y="390" width="240" height="110" rx="12" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="550" y="418" text-anchor="middle" font-size="13" font-weight="700" fill="#a50e0e">Rexy Local CA</text>
  <text x="550" y="440" text-anchor="middle" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#3c4043">ca/rexy.cer + ca/rexy.key</text>
  <text x="550" y="462" text-anchor="middle" font-size="10.5" fill="#202124">trusted by OS (rexy trust)</text>

  <!-- Production / Internet -->
  <rect x="810" y="390" width="190" height="110" rx="12" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"/>
  <text x="905" y="418" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">Production / Internet</text>
  <text x="905" y="440" text-anchor="middle" font-size="10.5" fill="#202124">real origin, untouched</text>

  <!-- Arrows -->
  <path d="M135,180 L135,90 L426,90" fill="none" stroke="#5f6368" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="280" y="80" text-anchor="middle" font-size="10" fill="#5f6368" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">FindProxyForURL(host)</text>

  <path d="M230,255 L426,255" fill="none" stroke="#5f6368" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="327" y="243" text-anchor="middle" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#202124">https://prod.example.com/mini-app/*</text>
  <text x="327" y="272" text-anchor="middle" font-size="10" fill="#5f6368">TLS · SNI = prod host</text>

  <path d="M670,255 L806,255" fill="none" stroke="#5f6368" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="738" y="243" text-anchor="middle" font-size="10" fill="#202124">rewrite → --target</text>

  <path d="M550,385 L550,326" fill="none" stroke="#5f6368" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="562" y="360" font-size="10.5" fill="#5f6368">signs certificates</text>

  <path d="M670,300 L740,300 L740,445 L806,445" fill="none" stroke="#5f6368" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="752" y="332" font-size="10" fill="#5f6368">non-matching → passthrough</text>

  <path d="M135,330 L135,560 L905,560 L905,506" fill="none" stroke="#5f6368" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="520" y="548" text-anchor="middle" font-size="11" fill="#5f6368">everything else → DIRECT (WebRTC, CDN, messengers unaffected)</text>

  <text x="40" y="590" font-size="10" font-style="italic" fill="#5f6368">Only the host passed via --host is intercepted; its TLS is terminated with a certificate signed by the Rexy Local CA.</text>
</svg>
