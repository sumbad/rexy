[package]
name = "rexy"
version = "0.1.0"
edition = "2024"
authors = ["sumbad"]
description = "Launch a browser with a local MITM proxy for transparent dev redirects"
homepage = "https://github.com/sumbad/rexy"
repository = "https://github.com/sumbad/rexy"
license = "MIT"
readme = "README.md"

[package.metadata.dist]
npm-package = "rexy-cli"

[dependencies]
clap = { version = "4", features = ["derive"] }
hudsucker = "0.25"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "rustls-native-certs"] }
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "process",
  "net",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
